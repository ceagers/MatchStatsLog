name: Deploy web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compile the app (JSX to a plain ES module bundle)
        run: |
          npx -y esbuild@0.24.0 src/main.jsx \
            --bundle --format=esm --jsx=automatic \
            --alias:react=./vendor/react.mjs \
            --alias:react/jsx-runtime=./vendor/react-jsx-runtime.mjs \
            --alias:react-dom=./vendor/react-dom.mjs \
            --alias:react-dom/client=./vendor/react-dom-client.mjs \
            --alias:konsta/react=./vendor/konsta-react.mjs \
            --outfile=dist/app.js --minify
      - name: Stage the site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp robots.txt _site/
          cp -r styles vendor _site/
          mkdir -p _site/assets
          cp assets/icon.png assets/badge.PNG assets/home.jpg _site/assets/
          cp dist/app.js _site/
          # The hosted copy loads the compiled bundle; the repo copy keeps
          # loading src directly so the app's own viewer runs it un-built.
          sed -i 's|src="src/main.jsx"|src="app.js"|' _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4